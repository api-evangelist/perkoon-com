aid: perkoon-com
name: Perkoon
description: >-
  Perkoon is an account-less file-transfer service built for AI agents as much as for people, operated by MB "Perkunu
  simtas" in Lithuania. Small files upload once to free cloud delivery and return a durable ~48-hour share link
  (fire-and-forget); larger files stream directly between machines over WebRTC with no size limit, with perkoon.com
  doing signalling only. The same capability - create a transfer session, join it, check it - is projected over four
  entry points the provider documents for agents: an A2A agent card at /.well-known/agent-card.json (conformant to
  A2A 1.0.0, protocol 0.3.0, four skills, JSON-RPC at /a2a), an anonymous REST surface at /api/v1/sessions consumed by
  the first-party perkoon CLI (npm, also an importable JS library), a stdio MCP server (@perkoon/mcp: send_file,
  receive_file, check_session) and a Playwright-ready browser flow. It publishes llms.txt, a skillpm Agent Skill
  (perkoon-transfer) and per-IP rate limits inside the card itself. No OpenAPI, OAuth or event surface is published,
  and every HTML page - including the /automate guide and /pricing - sits behind a Cloudflare managed challenge for
  non-browser clients, while the card, llms.txt and robots.txt are served openly.
