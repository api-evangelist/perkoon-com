- aid: perkoon-com:perkoon-sessions-api
  name: Perkoon Sessions API
  description: >-
    The anonymous REST surface under https://perkoon.com/api/v1 that every Perkoon client uses: POST /sessions (create,
    10/min per IP), POST /sessions/{code}/join (30/min) and GET /sessions/{code}/status (20/min), plus a Phoenix
    channel at wss://perkoon.com/socket for WebRTC signalling. Documented by the provider through its reference
    client rather than a contract: the perkoon CLI on npm (28 releases since 2026-02, --json NDJSON events, exit codes
    0-5, also importable as a JS library), llms.txt and the perkoon-transfer Agent Skill. No OpenAPI is published and
    robots.txt disallows /api/, so the paths are transcribed from the CLI bundle and were not probed. Rate-limit
    exhaustion returns 429 with Retry-After; no accounts, keys or OAuth exist.
  humanURL: https://perkoon.com/automate
  baseURL: https://perkoon.com/api/v1
