apis:
- aid: perkoon-com:perkoon-a2a-agent
  name: Perkoon Agent Data Layer (A2A)
  description: >-
    Perkoon's agent-to-agent surface: an A2A agent card served at /.well-known/agent-card.json and the legacy
    /.well-known/agent.json (byte-identical, 200 application/json) pointing at a JSON-RPC 2.0 endpoint at
    https://perkoon.com/a2a. Four skills - describe (capabilities without creating a session), send-files (creates a
    session and returns a browser sender_url plus the CLI command with a sender-key), receive-files (join by code) and
    session-status - application/json in and out, no streaming, push notifications or task history. The card is
    conformant against A2A 1.0.0 (protocolVersion 0.3.0, preferredTransport JSONRPC) and carries non-standard but useful
    rateLimits and resources fields. Anonymous. Every POST to /a2a counts against the 10/min per-IP create budget. The
    endpoint answered a Cloudflare managed challenge to non-browser probes on 2026-09-19.
  humanURL: https://perkoon.com/automate
  baseURL: https://perkoon.com/a2a
