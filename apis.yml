- aid: perkoon-com:perkoon-mcp-server
  name: Perkoon MCP Server
  description: >-
    Official local stdio MCP server, @perkoon/mcp on npm (0.3.0, 2026-09-01), installed with npx -y @perkoon/mcp and
    named in the A2A card's resources[] and in llms.txt as the recommended path for coding agents (Claude Code, Claude
    Desktop, Cursor, VS Code, Windsurf). Three tools with zod input schemas - send_file (file_path, password, timeout,
    mode auto|relay|p2p), receive_file (session_code, output_dir, password) and check_session (session_code) - the
    first two spawning the perkoon CLI with --json and the third calling GET /api/v1/sessions/{code}/status on
    https://perkoon.com. Path policy refuses system and credential directories; max 5 concurrent transfers. There is no
    hosted MCP endpoint (mcp.perkoon.com does not resolve; not on registry.modelcontextprotocol.io).
  humanURL: https://www.npmjs.com/package/@perkoon/mcp
