    Recorded from the provider's packages, not observed.
domain_standard:
  applicable: false
  note: >-
    Perkoon is a consumer/agent file-transfer service; no sector interchange standard (AS2/AS4, SFTP profiles, MFT
    standards, SCIM, OData, FHIR, etc.) applies to its published surface, and none is declared in the card, llms.txt or
