    Saved verbatim to llms/perkoon-com-llms.txt. No llms-full.txt is published.
- id: robots-txt-ai-crawler-policy
  conforms: true
  evidence: >-
    /robots.txt: "User-agent: * / Allow: /", a Sitemap line, a comment block "AI Agents & Operators Welcome" pointing
    at the agent card, llms.txt and /automate, and Disallow on /gx7k9m2p5/, /api/ and /analytics/. The /api/
