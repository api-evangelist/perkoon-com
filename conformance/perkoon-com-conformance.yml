description: >-
  What Perkoon's machine surface actually conforms to. The company is built around agents as first-class users and
  publishes an A2A card that passes every structural check, an llms.txt in the llmstxt.org shape, an Agent Skills-format
  SKILL.md, and an MCP server on the official TypeScript SDK - but no REST contract (OpenAPI), no OAuth surface, no
  event surface and no security.txt. The REST paths the CLI calls are described only by the CLI's own bundle. Cross-
  cutting API standards that do not apply are recorded as not applicable rather than omitted. No domain standard for
  the company's market (file transfer) is declared, and none is asserted here.
standards:
- id: a2a-agent-card
  conforms: true
  grade: conformant
  evidence: >-
    AgentCard served at the canonical /.well-known/agent-card.json AND the legacy /.well-known/agent.json on
    perkoon.com (200, application/json, byte-identical, 4,756 bytes; www 301s to apex). capabilities is an object,
    protocolVersion "0.3.0" present, skills is an array of 4, preferredTransport JSONRPC, defaultInputModes /
    defaultOutputModes present, provider and documentationUrl present. Non-standard additive fields (extensions,
    rateLimits, resources). See a2a/perkoon-com-a2a.yml.
- id: a2a-jsonrpc-endpoint
  conforms: null
  evidence: >-
    The card names https://perkoon.com/a2a (JSONRPC) and llms.txt documents "POST https://perkoon.com/a2a with JSON-RPC
    2.0", but the endpoint answered a Cloudflare managed challenge (HTTP 403, cf-mitigated: challenge) to a JSON-RPC
    POST with and without a browser User-Agent on 2026-09-19. Not verified; not marked non-conformant, because the
    wall is the edge policy toward this client, not the protocol.
- id: mcp
  conforms: true
  protocol_version: null
  evidence: >-
    @perkoon/mcp 0.3.0 builds on @modelcontextprotocol/sdk ^1.12.1 (McpServer + StdioServerTransport) and registers
    three tools with zod input schemas via server.tool(); capabilities tools only. Local stdio transport - no hosted
    endpoint, so the negotiated protocolVersion depends on the host; not observed. See mcp/perkoon-com-mcp.yml.
- id: mcp-streamable-http
  conforms: false
  applicable: false
  evidence: No remote MCP endpoint exists (mcp.perkoon.com has no DNS; /.well-known/mcp.json 404; registry.modelcontextprotocol.io 0 servers). Stdio only.
- id: agent-skills
  conforms: true
  evidence: >-
    perkoon-transfer 1.1.0 ships skills/perkoon-transfer/SKILL.md with Agent Skills frontmatter (name, description,
