  months since 2026-02-26 (latest 0.5.7 on 2026-09-04), the MCP server 7 versions since 2026-03-13 (0.3.0 on
  2026-09-01) and the skill 4 versions since 2026-02-28 (1.1.0 on 2026-09-01) - all three touched within the three
  weeks before this pass, which is the freshest currency signal in this profile. The REST path is versioned at /v1;
  the A2A card is at version 1.5.0 on protocol 0.3.0. Every published integration path installs the CLI as
  perkoon@latest, so there is effectively no pinned client version and no compatibility promise. /status, /changelog
  and /roadmap answered the Cloudflare challenge (403), so their existence could not be confirmed or denied; none is
  linked from llms.txt, the card or the packages, which is the stronger signal that they do not exist.
