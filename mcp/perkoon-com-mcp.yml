description: >-
  Perkoon ships an official MCP server as a local stdio package, @perkoon/mcp on npm (author Perkoon, same maintainer
  as the perkoon CLI; homepage https://perkoon.com; proprietary licence). It is named in the A2A agent card's resources[]
  (type mcp-server), in llms.txt ("MCP Server (Best for coding agents)") and in the CLI's AGENTS.md. There is NO hosted
  or remote MCP endpoint: mcp.perkoon.com has no DNS record, /.well-known/mcp.json and /mcp.json are not served, and the
  official registry (registry.modelcontextprotocol.io) returns 0 servers for "perkoon". The server is a thin wrapper -
  it registers three tools with zod schemas and, for send/receive, spawns `npx -y perkoon@latest ... --json` and parses
  the CLI's JSONL events (setting PERKOON_SOURCE=agent_mcp); check_session is a direct GET to
  https://perkoon.com/api/v1/sessions/<CODE>/status. The tool list and inputSchemas below are transcribed from the
  published package source (src/index.js, 12,489 bytes), not from a live tools/list, because a stdio server has no
  endpoint to introspect without executing the package. Requires Node.js >= 18. Not on registry.modelcontextprotocol.io.
