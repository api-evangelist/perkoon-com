limit_count: 4
summary: >-
  Perkoon publishes its rate limits in four places that agree with each other, including inside the A2A agent card
  itself (a non-standard rateLimits field), which is the one place an agent reads before its first call. Limits are
  per IP over a sliding 60-second window and are bucketed by request type on the REST paths: 10 session creates, 30
  joins and 20 status checks per minute. On /a2a every JSON-RPC POST - send-files, receive-files and session-status
  alike - counts against the 10/minute create budget. Exhaustion returns HTTP 429 with a Retry-After header in
  seconds, mirrored as retry_after in the JSON body. Limits key on IP, not agent identity, so clients behind a shared
  egress (NAT, CI, cloud gateway) share one budget. The published Agent Skill adds an operational caveat: the CLI
  currently reports a 429 as exit code 3 (network/session error) before session_created, so a fast exit-3 after
  several rapid sends should be read as rate limiting. No limit was observed live: robots.txt disallows /api/ (honored)
  and /a2a answered a Cloudflare challenge, so nothing here is probed.
